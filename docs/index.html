<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AsgardCRM Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="AsgardCRM — extensible entity/workflow CRM package for Laravel. Documentation in English and Italian.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9889;</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.css">
  <style>
    :root {
      --theme-color: #206bc4;
    }
    .app-name-link img { border-radius: 4px; }
    .lang-switch { font-size: 12px; opacity: .75; }
  </style>
</head>
<body>
  <div id="app">Loading AsgardCRM documentation...</div>
  <script>
    window.$docsify = {
      name: 'AsgardCRM',
      logo: '_media/logo.svg',
      repo: 'fazzinipierluigi/AsgardCRM',
      loadSidebar: true,
      loadNavbar: true,
      mergeNavbar: true,
      relativePath: true,
      autoHeader: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      coverpage: false,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/en/': 'Search documentation...',
          '/it/': 'Cerca nella documentazione...',
          '/': 'Search / Cerca...'
        },
        noData: {
          '/en/': 'No results found.',
          '/it/': 'Nessun risultato trovato.',
          '/': 'No results / Nessun risultato'
        }
      },
      copyCode: {
        buttonText: {
          '/en/': 'Copy',
          '/it/': 'Copia',
          '/': 'Copy'
        },
        errorText: {
          '/en/': 'Error',
          '/it/': 'Errore',
          '/': 'Error'
        },
        successText: {
          '/en/': 'Copied',
          '/it/': 'Copiato',
          '/': 'Copied'
        }
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true
      },
      formatUpdated: '{MM}/{DD}/{YYYY}'
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
